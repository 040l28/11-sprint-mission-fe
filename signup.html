<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="container">
    <a href="/">
      <div id="logo-image">
      <img id="logo" src="/imgs/logo.svg" alt="판다마켓 로고">
    </a>
  </div>
  <section>
    <div id="login-form">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" placeholder="이메일을 입력해주세요">
      <label for="nickname">닉네임</label>
      <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력해주세요">
      <label for="password">비밀번호</label>
      <div id="password-box">
        <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요">
        <img src="/imgs/password.png" alt="toggle password" class="toggle-password">
      </div>
      <label for="confirm-password">비밀번호 확인</label>
      <div id="confirm-password-box">
          <input id="confirm-password" name="confirm-password" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
          <img src="/imgs/password.png" alt="toggle password" class="toggle-password">
      </div>
    </div>
    <button id="signup-btn" disabled>회원가입</button>
    <div id="simple-login">
      <p>간편 로그인하기</p>
      <div>
        <a href="https://www.google.com/" target="_blank">
          <img src="/imgs/google.png" alt="구글"><a href="https://www.kakaocorp.com/page/" target="_blank">
          <img src="/imgs/kakao.png" alt="카카오톡">
        </a>
      </div>
    </div>
    <div id="signup">
      <p>이미 회원이신가요?</p>
      <a href="/login.html">로그인</a>
    </div>
  </section>
  <script>
    const toggleBtns = document.querySelectorAll('.toggle-password');
    
    toggleBtns.forEach(btn => {
      btn.onclick = () => {
        const input = btn.parentElement.querySelector('input');
        input.type = input.type === "password" ? "text" : "password";
      }
    });

    const emailInput = document.getElementById('email');
    const nicknameInput = document.getElementById('nickname');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const signupBtn = document.getElementById('signup-btn');

    function checkInputs() {
      if(emailInput.value.trim() !== "" &&
         nicknameInput.value.trim() !== "" &&
         passwordInput.value.trim() !== "" &&
         confirmInput.value.trim() !== "") {
        signupBtn.classList.add('active');
        signupBtn.disabled = false;
      } else {
        signupBtn.classList.remove('active');
        signupBtn.disabled = true;
      }
    }

    [emailInput, nicknameInput, passwordInput, confirmInput].forEach(input => {
      input.addEventListener('input', checkInputs);
    });
  </script>
</body>
